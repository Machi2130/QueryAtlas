[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent-mcp"
version = "1.0.0"
description = "Multi-Database Natural Language SQL & NoSQL Agent + MCP Server with RSA-2048 OAEP Connection Tokens and RBAC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "mcp>=1.10,<2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "pymssql>=2.2.11",
    "pyodbc>=5.0.0",
    "pymongo>=4.6.0",
    "cassandra-driver>=3.29.0",
    "sqlglot>=26,<27",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "redis>=5.0.0",
    "supabase>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.2.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
sql-agent-mcp = "sql_agent.server:cli"

[tool.setuptools.packages.find]
include = ["sql_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

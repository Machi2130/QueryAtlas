<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">QueryAtlas: four locks between any AI and your data</title><desc id="d">Questions from developers (MCP) and teams (web app) pass four rings before reaching the databases: sign-in and roles, the read-only validator, the tenant filter and encrypted connections. The AI model and the knowledge layer help write the query, every request is audited, and an unsafe query is stopped at the validator.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="53%" r="65%"><stop offset="0" stop-color="#131a26"/><stop offset="1" stop-color="#0b0d12"/></radialGradient>
  <radialGradient id="core" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#3a2f12"/><stop offset="1" stop-color="#17140c"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <pattern id="stars" width="46" height="46" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="0.9" fill="#232b3a"/><circle cx="31" cy="34" r="0.7" fill="#1d2431"/></pattern>
</defs>
<style>
  .spin { transform-origin: 600px 500px; animation: spin linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flow { stroke-dasharray: 5 9; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .25; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { .spin,.flow,.breathe { animation: none; } }
</style>
